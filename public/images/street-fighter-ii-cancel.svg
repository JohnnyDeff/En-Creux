<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" role="img" aria-labelledby="title description">
  <title id="title">Le cancel dans Street Fighter II</title>
  <desc id="description">Deux trajets de même largeur, avec les impacts alignés. Sans cancel, le mouvement se termine avant l’action suivante. Avec cancel, sa fin est barrée et remplacée par le Hadoken.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#0A0A0A"/></marker>
    <style>
      text { fill: #0A0A0A; font: 18px Inter, Arial, sans-serif; }
      .title { font: 700 30px 'Space Grotesk', Arial, sans-serif; letter-spacing: -1px; }
      .label { font: 700 21px 'Space Grotesk', Arial, sans-serif; }
      .muted { fill: #555; font-size: 16px; }
      .line { fill: none; stroke: #0A0A0A; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="720" height="460" fill="#F5F5F3"/>
  <text x="24" y="42" class="title">Le cancel dans Street Fighter II</text>
  <text x="24" y="76">Le coup spécial ne s’ajoute pas après le coup normal :</text>
  <text x="24" y="101">il en remplace la fin.</text>
  <path d="M190 175V365" stroke="#aaa" stroke-dasharray="3 6"/>
  <text x="24" y="150" class="label">A — Sans cancel</text>
  <path d="M60 192H654" class="line"/>
  <circle cx="60" cy="192" r="5" fill="#0A0A0A"/>
  <circle cx="190" cy="192" r="8" fill="#D64833"/>
  <circle cx="342" cy="192" r="5" fill="#0A0A0A"/>
  <circle cx="490" cy="192" r="5" fill="#0A0A0A"/>
  <g text-anchor="middle">
    <text x="60" y="222">Attaque<tspan x="60" dy="23">normale</tspan></text>
    <text x="190" y="222">Impact</text>
    <text x="342" y="222">Fin du<tspan x="342" dy="23">mouvement</tspan></text>
    <text x="490" y="222">Retour<tspan x="490" dy="23">au repos</tspan></text>
    <text x="638" y="222">Action<tspan x="638" dy="23">suivante</tspan></text>
  </g>
  <path d="M24 275H696" stroke="#d7d7d3"/>
  <text x="24" y="312" class="label">B — Avec cancel</text>
  <path d="M60 355H190" fill="none" stroke="#0A0A0A" stroke-width="2"/>
  <circle cx="60" cy="355" r="5" fill="#0A0A0A"/>
  <circle cx="190" cy="355" r="8" fill="#D64833"/>
  <path d="M190 355H420" stroke="#777" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M208 341L414 369M208 369L414 341" stroke="#D64833" stroke-width="3"/>
  <text x="310" y="334" text-anchor="middle" class="muted">Fin du mouvement</text>
  <path d="M190 364V410H485" class="line"/>
  <g text-anchor="middle">
    <text x="60" y="388">Attaque<tspan x="60" dy="23">normale</tspan></text>
    <text x="190" y="340">Impact</text>
    <text x="335" y="436" class="muted">remplacée par</text>
  </g>
  <rect x="495" y="345" width="176" height="88" rx="4" fill="#F5F5F3" stroke="#D64833" stroke-width="2"/>
  <text x="583" y="373" text-anchor="middle" class="label">Hadoken</text>
  <text x="583" y="399" text-anchor="middle" class="muted">Attaque spéciale<tspan x="583" dy="21">enchaînée</tspan></text>
</svg>
